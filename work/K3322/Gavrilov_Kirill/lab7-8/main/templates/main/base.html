<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}My Site{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="d-flex flex-column min-vh-100">
<header class="bg-dark text-white py-3 mb-4">
    <div class="container">
        <nav сlass="nav">
            <a class="nav-link text-white" href="{% url 'home' %}">Главная</a>
            <a class="nav-link text-white" href="{% url 'about' %}">О разработке</a>
            <a class="nav-link text-white" href="{% url 'contact' %}">Обратная связь</a>
        </nav>
    </div>
</header>

<main class="container mb-5">
    {% block content %}{% endblock %}
</main>

<footer class="mt-auto bg-light py-3 text-center">
    <div class="container">
        <p class="mb-0">© 2025 My Site</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
